<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111411">
  <meta name="description" content="Семейное табло у холодильника">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=7">
  <title>holdom — дома</title>
</head>
<body>
  <main class="dashboard">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">h</span>holdom</div>
      <div class="app-signature">
        <img src="itivan-sign.svg" alt="itivan">
        <span id="app-version"></span>
      </div>
      <button type="button" id="keep-screen-on" class="quiet-button screen-button" aria-pressed="false">Не гасить экран</button>
    </header>
    <p id="screen-status" class="screen-status hidden" role="status"></p>
    <div class="board">
      <div class="left-column">
        <section class="hero" aria-label="Часы">
          <div id="clock" class="clock">--:--</div>
          <div id="date" class="date"></div>
        </section>
        <section class="panel home-panel" aria-labelledby="home-title">
          <div class="section-head"><h2 id="home-title">Домашние дела</h2><span class="demo">Пример</span></div>
          <p class="chore">Полить цветы</p>
        </section>
        <div class="assistant-card">
          <span class="jo" aria-hidden="true">J</span>
          <div><strong>Джо</strong><small>Голосовой помощник пока не подключён</small></div>
        </div>
      </div>
      <div class="right-column">
        <section class="panel calendar-panel" aria-labelledby="calendar-title">
          <div class="section-head">
            <h2 id="calendar-title">Кто когда</h2>
            <button type="button" class="quiet-button hidden" id="calendar-disconnect">Отключить</button>
          </div>
          <form id="calendar-connect" class="calendar-connect">
            <label for="calendar-key">Ключ входа аккаунта планшета</label>
            <div class="connect-row">
              <input id="calendar-key" type="password" autocomplete="off" required>
              <button type="submit" class="quiet-button">Подключить</button>
            </div>
          </form>
          <p id="calendar-status" class="hint" role="status"></p>
          <div class="calendar-nav">
            <button type="button" class="quiet-button" id="previous-month" aria-label="Предыдущий месяц">‹</button>
            <h3 id="calendar-month"></h3>
            <button type="button" class="quiet-button" id="next-month" aria-label="Следующий месяц">›</button>
          </div>
          <div class="calendar-weekdays" aria-hidden="true"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
          <div id="calendar-days" class="calendar-days"></div>
          <div id="calendar-agenda" class="hidden">
            <h3 id="calendar-day-title"></h3>
            <div id="calendar-events" class="event-list"></div>
          </div>
        </section>
      </div>
    </div>
  </main>
  <video id="screen-video" class="screen-video hidden" preload="none" muted loop playsinline aria-hidden="true"></video>
  <script src="app.js?v=7"></script>
  <script src="calendar.js?v=7"></script>
</body>
</html>
