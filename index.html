<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="description" content="Семейное табло у холодильника">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=24">
  <title>holdom — дома</title>
</head>
<body>
  <main class="dashboard">
    <header class="topbar">
      <div class="brand-group">
        <div class="brand"><span class="brand-mark" aria-hidden="true">h</span>holdom</div>
        <span id="app-version" class="app-version"></span>
      </div>
      <div class="screen-actions">
        <label class="theme-chip" title="Оформление holdom">
          <span class="theme-chip-dot" aria-hidden="true"></span>
          <select id="theme-select" aria-label="Оформление holdom">
            <option value="auto">Системная</option>
            <option value="light">Светлая</option>
            <option value="dark">Тёмная</option>
            <option value="olive">Олива</option>
            <option value="storm">Шторм</option>
          </select>
        </label>
        <button type="button" id="keep-screen-on" class="quiet-button screen-button" aria-pressed="false">Не гасить экран</button>
        <button type="button" id="fullscreen-button" class="quiet-button screen-button" aria-pressed="false">На весь экран</button>
        <button type="button" id="reload-button" class="quiet-button header-icon" title="Обновить" aria-label="Обновить">↻</button>
        <button type="button" id="calendar-settings-button" class="quiet-button header-icon"
          title="Настройки holdom" aria-label="Настройки holdom" aria-expanded="false" aria-controls="calendar-settings">
          <svg class="settings-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M10 3h4l.5 2.6 2 .9 2.3-1.3 2.8 2.8-1.3 2.3.9 2 2 .5v3.4l-2.4.5-.9 1.8 1.2 2-2.4 2.3-2.1-1.2-2 .8-.5 2.1h-4l-.5-2.1-2-.8-2.1 1.2-2.4-2.3 1.2-2-.9-1.8-2.4-.5v-3.4l2-.5.9-2-1.3-2.3 2.8-2.8 2.3 1.3 2-.9z" transform="translate(1.35 .2) scale(.88)"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </header>
    <p id="screen-status" class="screen-status hidden" role="status"></p>
    <p id="fullscreen-status" class="screen-status hidden" role="status"></p>
    <div class="board">
      <div class="left-column">
        <div class="left-upper">
        <section class="hero" aria-label="Часы Джованни">
          <button type="button" id="jo-add" class="clock-face" aria-label="Открыть Джованни"
            aria-controls="jo-chat">
            <span class="clock" aria-hidden="true">
              <span id="clock-hours" class="clock-eye">--</span><span class="clock-colon">:</span><span id="clock-minutes" class="clock-eye">--</span>
            </span>
            <span class="jo-smile" aria-hidden="true"></span>
          </button>
          <div id="date" class="date"></div>
          <p id="jo-listening" class="hint" role="status"></p>
          <p id="jo-result" class="hint" role="status"></p>
        </section>
        <section id="jo-chat" class="panel jo-chat" aria-label="Диалог с Джованни">
          <div id="jo-chat-messages" class="jo-chat-messages hidden" role="log" aria-label="Реплики"></div>
          <p id="jo-chat-status" class="hint" role="status"></p>
          <div class="jo-chat-actions">
            <button type="button" id="jo-cloud" class="quiet-button primary-button hidden">Задать вопрос</button>
            <button type="button" id="jo-manual" class="quiet-button">Записать дело</button>
            <button type="button" id="jo-note" class="quiet-button">Сделать заметку</button>
            <button type="button" id="jo-review" class="quiet-button hidden">Проверить дело</button>
            <button type="button" id="jo-discard" class="quiet-button hidden">Отменить черновик</button>
            <button type="button" id="jo-connect" class="quiet-button hidden">Настроить голос</button>
          </div>
        </section>
        </div>
        <div class="left-lower">
        <section id="calendar-nearest" class="panel nearest-panel hidden" aria-labelledby="nearest-label">
          <h2 id="nearest-label">Ближайшие дела</h2>
          <ul id="nearest-items" class="nearest-items"></ul>
        </section>
        </div>
      </div>
      <div class="right-column">
        <section class="panel calendar-panel" aria-label="Календарь «Кто когда»">
          <p id="calendar-board-status" class="hint" role="status"></p>
          <section id="calendar-settings" class="board-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="calendar-settings-heading">
            <div class="panel dialog-panel">
              <div class="section-head"><h2 id="calendar-settings-heading">Настройки holdom</h2><button type="button" id="calendar-settings-close" class="quiet-button">Закрыть</button></div>
              <label class="calendar-preference"><input id="show-past-days" type="checkbox"> Показывать прошлые месяцы</label>
              <button type="button" id="calendar-today-button" class="quiet-button">К сегодняшней дате</button>
              <details class="voice-settings">
                <summary>Облачный Джованни</summary>
                <form id="voice-server-form">
                  <label for="voice-server-address">Адрес голосового сервера</label>
                  <input id="voice-server-address" type="text" placeholder="https://functions.yandexcloud.net/…" autocomplete="off">
                  <label for="voice-server-code">Код подключения планшета</label>
                  <input id="voice-server-code" type="password" autocomplete="off" aria-describedby="voice-server-status">
                  <p id="voice-server-status" class="voice-status" role="status" aria-live="polite">Загружаю настройки…</p>
                  <button type="submit" class="quiet-button primary-button">Сохранить подключение</button>
                </form>
              </details>
              <form id="calendar-connect" class="calendar-connect">
                <label for="calendar-key">Ключ входа в «Кто когда»</label>
                <div class="connect-row">
                  <input id="calendar-key" type="password" autocomplete="off" required>
                  <button type="submit" class="quiet-button">Подключить</button>
                </div>
              </form>
              <p id="calendar-status" class="hint" role="status"></p>
              <button type="button" class="quiet-button hidden" id="calendar-disconnect">Отключить аккаунт</button>
              <section id="calendar-people" class="calendar-people hidden" aria-labelledby="people-heading">
                <h3 id="people-heading">Люди</h3>
                <form id="people-search">
                  <label for="people-query">Имя или @ник</label>
                  <div class="connect-row">
                    <input id="people-query" type="search" autocomplete="off" maxlength="21" required>
                    <button type="submit" class="quiet-button">Найти</button>
                  </div>
                </form>
                <p id="people-status" class="hint" role="status"></p>
                <ul id="people-results" class="people-results"></ul>
              </section>
            </div>
          </section>
          <div id="calendar-people-filter" class="calendar-people-filter hidden" role="group" aria-label="Чьи дела показывать">
            <div id="filter-chips" class="filter-chips"></div>
          </div>
          <div id="calendar-month-view" class="calendar-month-view">
            <div id="calendar-grid-space" class="calendar-grid-space">
              <div id="calendar-grid" class="calendar-grid">
                <div id="calendar-weekdays" class="calendar-weekdays" aria-hidden="true"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
                <div id="calendar-feed" class="calendar-feed" tabindex="0" aria-label="Лента месяцев"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <section id="calendar-agenda" class="board-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="calendar-day-title">
      <div class="panel dialog-panel">
        <div class="section-head">
          <h2 id="calendar-day-title"></h2>
          <button type="button" id="calendar-day-close" class="quiet-button">Закрыть</button>
        </div>
        <div id="calendar-events" class="event-list"></div>
      </div>
    </section>
    <div id="note-dialog" class="board-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="note-heading">
      <form id="note-form" class="panel dialog-panel jo-form">
        <div class="section-head">
          <h2 id="note-heading">Заметки</h2>
          <button type="button" id="note-close" class="quiet-button">Закрыть</button>
        </div>
        <label for="note-text">Новая заметка</label>
        <textarea id="note-text" rows="3" maxlength="600" required></textarea>
        <p id="note-status" class="hint" role="status"></p>
        <button type="submit" class="quiet-button primary-button">Сохранить заметку</button>
        <ul id="note-list" class="note-list"></ul>
      </form>
    </div>
    <div id="jo-dialog" class="board-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="jo-heading">
      <form id="jo-form" class="panel dialog-panel jo-form">
        <div class="section-head"><h2 id="jo-heading">Добавить дело</h2><button type="button" id="jo-close" class="quiet-button">Закрыть</button></div>
        <p id="jo-status" class="hint" role="status"></p>
        <div>
          <button type="button" id="jo-voice-action" class="quiet-button hidden">Сказать команду</button>
          <button type="button" id="jo-voice" class="quiet-button">Диктовать дело</button>
          <button type="button" id="jo-wake" class="quiet-button" aria-pressed="false">Слушать команды для дел</button>
          <label for="jo-title">Дело</label>
          <input id="jo-title" maxlength="60" placeholder="Например, забрать посылку" autocomplete="off" required>
          <div class="jo-fields">
            <div><label for="jo-date">Дата</label><input id="jo-date" type="date" required></div>
            <div><label for="jo-time">Время</label><input id="jo-time" type="time"></div>
          </div>
          <p id="jo-calendar-required" class="hint hidden">Подключите «Кто когда» в настройках, чтобы сохранить дело.</p>
          <button type="submit" id="jo-save" class="quiet-button primary-button">Сохранить дело</button>
        </div>
      </form>
    </div>
  </main>
  <video id="screen-video" class="screen-video hidden" preload="none" muted loop playsinline aria-hidden="true"></video>
  <script src="app.js?v=24"></script>
  <script src="voice-turn.js?v=24"></script>
  <script src="calendar.js?v=24"></script>
</body>
</html>
