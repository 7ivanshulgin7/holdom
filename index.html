<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111411">
  <meta name="description" content="Семейное табло у холодильника">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=6">
  <title>holdom — дома</title>
</head>
<body>
  <main class="dashboard">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">h</span>holdom</div>
      <button type="button" id="settings-button" class="avatar" aria-label="Настройки" aria-expanded="false" aria-controls="settings">⚙</button>
    </header>
    <section id="settings" class="screen-settings hidden" aria-label="Настройки">
      <label for="keep-screen-on"><input type="checkbox" id="keep-screen-on"> Не гасить экран</label>
      <p id="screen-status" role="status"></p>
    </section>
    <div class="board">
      <div class="left-column">
        <section class="hero" aria-label="Часы">
          <div id="clock" class="clock">--:--</div>
          <div id="date" class="date"></div>
        </section>
        <section class="panel home-panel" aria-labelledby="home-title">
          <div class="section-head"><h2 id="home-title">Домашние дела</h2><span class="demo">Пример</span></div>
          <p class="chore">Полить цветы</p>
        </section>
        <div class="assistant-card">
          <span class="jo" aria-hidden="true">J</span>
          <div><strong>Джо</strong><small>Голосовой помощник пока не подключён</small></div>
        </div>
      </div>
      <div class="right-column">
        <section class="panel" aria-labelledby="today-title">
          <div class="section-head"><h2 id="today-title">Планы на сегодня</h2><span class="demo">Примеры</span></div>
          <div class="event-list">
            <article class="event"><div class="event-time">09:30</div><div class="event-info pink"><strong>Забрать посылку</strong><span>Иван · пункт выдачи</span></div></article>
            <article class="event"><div class="event-time">16:00</div><div class="event-info blue"><strong>Музыкалка</strong><span>Лера · взять ноты</span></div></article>
            <article class="event"><div class="event-time">19:00</div><div class="event-info green"><strong>Ужин у родителей</strong><span>Все вместе</span></div></article>
          </div>
        </section>
        <section class="panel" aria-labelledby="shopping-title">
          <div class="section-head">
            <h2 id="shopping-title">Покупки <span id="shopping-count" class="shopping-count">0</span></h2>
            <button type="button" class="quiet-button" id="clear-done">Убрать купленное</button>
          </div>
          <form id="shopping-form" class="add-form">
            <input id="shopping-input" autocomplete="off" aria-label="Новая покупка" placeholder="Что купить?">
            <button type="submit" aria-label="Добавить покупку">+</button>
          </form>
          <ul id="shopping-list" class="shopping-list"></ul>
          <p id="shopping-empty" class="hint">Список пока пуст.</p>
        </section>
      </div>
    </div>
    <footer class="app-signature">
      <img src="itivan-sign.svg" alt="itivan">
      <span id="app-version"></span>
    </footer>
  </main>
  <video id="screen-video" class="screen-video hidden" preload="none" muted loop playsinline aria-hidden="true"></video>
  <script src="app.js?v=6"></script>
</body>
</html>
